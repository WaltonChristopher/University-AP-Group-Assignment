ext-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="90" dy="0"># OnInitializedAsync(): Task</tspan><tspan x="90" dy="17">− HandleUserMessageSent(text: string): Task</tspan><tspan x="90" dy="17">− StartNewChat(): Task</tspan><tspan x="90" dy="17">− SelectConversation(id: Guid): Task</tspan><tspan x="90" dy="17">− ShowHelp(): Task</tspan><tspan x="90" dy="17">− RunConversationOperation(operation, errorMessage, pendingMessage): Task</tspan><tspan x="90" dy="17">+ Dispose(): void</tspan></text><text xml:space="preserve" x="1330.0" y="242.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1330.0" dy="0">«Razor component»</tspan><tspan x="1330.0" dy="18">Sidebar</tspan><tspan x="1330.0" dy="18">Components.Chat</tspan></text><text xml:space="preserve" x="1070" y="309.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="1070" dy="0">+ Conversations: IReadOnlyList&lt;Domain.Conversation&gt;</tspan><tspan x="1070" dy="17">+ SelectedConversationId: Guid?</tspan><tspan x="1070" dy="17">+ IsBusy / CanShowHelp / DarkMode: bool</tspan><tspan x="1070" dy="17">+ OnConversationSelected: EventCallback&lt;Guid&gt;</tspan><tspan x="1070" dy="17">+ OnDarkModeToggled: EventCallback</tspan><tspan x="1070" dy="17">+ OnHelpRequested: EventCallback</tspan></text><text xml:space="preserve" x="405.0" y="897.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="405.0" dy="0">«Razor component»</tspan><tspan x="405.0" dy="18">ChatInput</tspan><tspan x="405.0" dy="18">Components.Chat</tspan></text><text xml:space="preserve" x="90" y="964.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="90" dy="0">+ IsSending / IsDisabled: bool</tspan><tspan x="90" dy="17">+ OnMessageSent: EventCallback&lt;string&gt;</tspan><tspan x="90" dy="17">− _draft: string</tspan></text><text xml:space="preserve" x="90" y="1029.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="90" dy="0">− OnDraftChanged(e): void</tspan><tspan x="90" dy="17">− OnKeyDown(e): Task</tspan><tspan x="90" dy="17">− Send(): Task</tspan></text><text xml:space="preserve" x="1285.0" y="897.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1285.0" dy="0">«Razor component»</tspan><tspan x="1285.0" dy="18">ChatWindow</tspan><tspan x="1285.0" dy="18">Components.Chat</tspan></text><text xml:space="preserve" x="980" y="964.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="980" dy="0">+ Messages: IReadOnlyCollection&lt;Domain.ChatMessage&gt;</tspan><tspan x="980" dy="17">+ PendingMessage: string?</tspan><tspan x="980" dy="17">+ IsBotTyping / IsBusy: bool</tspan><tspan x="980" dy="17">+ OnNewConversation: EventCallback</tspan></text><text xml:space="preserve" x="980" y="1046.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="980" dy="0"># OnAfterRenderAsync(firstRender: bool): Task</tspan><tspan x="980" dy="17">+ ScrollToBottomAsync(): Task</tspan></text><text xml:space="preserve" x="1285.0" y="1297.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1285.0" dy="0">«Razor component»</tspan><tspan x="1285.0" dy="18">ChatMessage</tspan><tspan x="1285.0" dy="18">Components.Chat</tspan></text><text xml:space="preserve" x="980" y="1364.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="980" dy="0">+ Message: Domain.ChatMessage?</tspan><tspan x="980" dy="17">+ PendingContent: string?</tspan><tspan x="980" dy="17">− /IsFromAgent: bool</tspan></text><rect x="864.6" y="187.5" width="250.8" height="21" fill="white"/><text xml:space="preserve" x="990.0" y="202.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="990.0" dy="0">renders / parameters / callbacks</tspan></text><text xml:space="preserve" x="933" y="360.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="933" dy="0">1</tspan></text><text xml:space="preserve" x="1015" y="302.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="1015" dy="0">1</tspan></text><rect x="428.3" y="786.5" width="243.4" height="21" fill="white"/><text xml:space="preserve" x="550.0" y="801.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="550.0" dy="0">renders; OnMessageSent callback</tspan></text><text xml:space="preserve" x="512.0" y="543.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="512.0" dy="0">1</tspan></text><text xml:space="preserve" x="417.0" y="864.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="417.0" dy="0">1</tspan></text><rect x="963.5" y="809.5" width="273.0" height="21" fill="white"/><text xml:space="preserve" x="1100.0" y="824.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1100.0" dy="0">renders; OnNewConversation callback</tspan></text><text xml:space="preserve" x="512.0" y="543.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="512.0" dy="0">1</tspan></text><text xml:space="preserve" x="1297.0" y="864.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="1297.0" dy="0">1</tspan></text><rect x="1137.4" y="1189.5" width="295.2" height="21" fill="white"/><text xml:space="preserve" x="1285.0" y="1204.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1285.0" dy="0">renders non-System and pending bubbles</tspan></text><text xml:space="preserve" x="1297.0" y="1096.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="1297.0" dy="0">1</tspan></text><text xml:space="preserve" x="1297.0" y="1264.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="1297.0" dy="0">0..*</tspan></text><text xml:space="preserve" x="1995.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1995.0" dy="0">«interface»</tspan><tspan x="1995.0" dy="18">IChatService</tspan></text><text xml:space="preserve" x="1760" y="301.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="1760" dy="0">+ StartConversationAsync(CT)</tspan><tspan x="1760" dy="17">+ GetConversationAsync(id, CT)</tspan><tspan x="1760" dy="17">+ GetConversationsAsync(CT)</tspan><tspan x="1760" dy="17">+ GetActiveConversationAsync(CT)</tspan><tspan x="1760" dy="17">+ AddMessageAsync(id, role, text, CT)</tspan><tspan x="1760" dy="17">+ SendMessageAsync(id, text, CT)</tspan></text><text xml:space="preserve" x="1760" y="418.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#475569"><tspan x="1760" dy="0">Returns domain conversations and messages; complete return</tspan><tspan x="1760" dy="16">  types on diagram 1.</tspan></text><text xml:space="preserve" x="1995.0" y="672.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1995.0" dy="0">«domain types»</tspan><tspan x="1995.0" dy="18">Conversation / ChatMessage</tspan></text><text xml:space="preserve" x="1760" y="722.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#475569"><tspan x="1760" dy="0">See diagrams 1 and 3.</tspan></text><text xml:space="preserve" x="1995.0" y="922.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1995.0" dy="0">«external interface»</tspan><tspan x="1995.0" dy="18">IJSRuntime</tspan></text><text xml:space="preserve" x="1760" y="971.5" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="1760" dy="0">+ InvokeAsync&lt;T&gt;(identifier, args): ValueTask&lt;T&gt;</tspan></text><text xml:space="preserve" x="1760" y="1004.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#475569"><tspan x="1760" dy="0">ChatWindow calls the InvokeVoidAsync extension.</tspan></text><text xml:space="preserve" x="1995.0" y="1132.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1995.0" dy="0">«external interface»</tspan><tspan x="1995.0" dy="18">IDisposable</tspan></text><text xml:space="preserve" x="1760" y="1181.5" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="1760" dy="0">+ Dispose(): void</tspan></text><text xml:space="preserve" x="1995.0" y="1322.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1995.0" dy="0">«external»</tspan><tspan x="1995.0" dy="18">ComponentBase</tspan></text><text xml:space="preserve" x="1760" y="1372.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#475569"><tspan x="1760" dy="0">Implicit base of all shown Razor components; inherited</tspan><tspan x="1760" dy="16">  lifecycle methods.</tspan></text><rect x="1635.1" y="589.5" width="65.80000000000001" height="21" fill="white"/><text xml:space="preserve" x="1668.0" y="604.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1668.0" dy="0">injects</tspan></text><rect x="1533.5" y="859.5" width="273.0" height="21" fill="white"/><text xml:space="preserve" x="1670.0" y="874.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1670.0" dy="0">injects; chatInterop.scrollToBottom</tspan></text><rect x="1620.1" y="1249.5" width="139.8" height="21" fill="white"/><text xml:space="preserve" x="1690.0" y="1264.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1690.0" dy="0">Message parameter</tspan></text><text xml:space="preserve" x="1160.0" y="1652.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#0f172a"><tspan x="1160.0" dy="0">App renders Routes (InteractiveServer) and ReconnectModal. Routes uses MainLayout and the routed Chat, Error and NotFound pages.</tspan><tspan x="1160.0" dy="16">Chat is available at / and /chat. MainLayout derives from LayoutComponentBase. UI shell / error components are summarized here.</tspan><tspan x="1160.0" dy="16">Input callback → Chat page → IChatService; finally the page reloads the selected conversation and sidebar list, including after failures.</tspan><tspan x="1160.0" dy="16">The window hides System messages. Pending customer text is UI state and is not a domain ChatMessage.</tspan></text></svg>