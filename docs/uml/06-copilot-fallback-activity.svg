"/><polygon points="825.0,935.0 819.0,922.0 831.0,922.0" fill="#475569" stroke="#475569" stroke-width="1.5"/><polyline points="960,1000.0 1210,1000.0" fill="none" stroke="#475569" stroke-width="1.5"/><polygon points="1210.0,1000.0 1197.0,1006.0 1197.0,994.0" fill="#475569" stroke="#475569" stroke-width="1.5"/><polyline points="1340.0,1055 1340,1110 1420,1110 1420.0,1160" fill="none" stroke="#475569" stroke-width="1.5"/><polygon points="1420.0,1160.0 1414.0,1147.0 1426.0,1147.0" fill="#475569" stroke="#475569" stroke-width="1.5"/><polyline points="1420.0,1250 1420.0,1272.5 1417.0,1272.5 1417.0,1295" fill="none" stroke="#475569" stroke-width="1.5"/><polygon points="1417.0,1295.0 1411.0,1282.0 1423.0,1282.0" fill="#475569" stroke="#475569" stroke-width="1.5"/><polyline points="1470,1000.0 1650,1000 1650,1410 1610,1410.0" fill="none" stroke="#475569" stroke-width="1.5"/><polygon points="1610.0,1410.0 1623.0,1404.0 1623.0,1416.0" fill="#475569" stroke="#475569" stroke-width="1.5"/><polyline points="1315.0,1460 1315,1510 1070,1510 1070.0,1570" fill="none" stroke="#475569" stroke-width="1.5"/><polygon points="1070.0,1570.0 1064.0,1557.0 1076.0,1557.0" fill="#475569" stroke="#475569" stroke-width="1.5"/><polyline points="690,1000.0 485,1000 485.0,1150" fill="none" stroke="#475569" stroke-width="1.5"/><polygon points="485.0,1150.0 479.0,1137.0 491.0,1137.0" fill="#475569" stroke="#475569" stroke-width="1.5"/><polyline points="485.0,1250 485,1710 655,1710 655.0,1770" fill="none" stroke="#475569" stroke-width="1.5"/><polygon points="655.0,1770.0 649.0,1757.0 661.0,1757.0" fill="#475569" stroke="#475569" stroke-width="1.5"/><polyline points="225,1200.0 195,1200 195,1338 1640,1338 1640,1205 1630,1205.0" fill="none" stroke="#475569" stroke-width="1.5"/><polygon points="1630.0,1205.0 1643.0,1199.0 1643.0,1211.0" fill="#475569" stroke="#475569" stroke-width="1.5"/><polyline points="1070.0,1670 1070,1715 1130,1715 1130,1815 1085,1815.0" fill="none" stroke="#475569" stroke-width="1.5"/><polygon points="1085.0,1815.0 1098.0,1809.0 1098.0,1821.0" fill="#475569" stroke="#475569" stroke-width="1.5"/><polyline points="655.0,1860 655.0,1895.0 657.0,1895.0 657.0,1930" fill="none" stroke="#475569" stroke-width="1.5"/><polygon points="657.0,1930.0 651.0,1917.0 663.0,1917.0" fill="#475569" stroke="#475569" stroke-width="1.5"/><text xml:space="preserve" x="40" y="56.5" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#334155"><tspan x="40" dy="0">6. Copilot fallback activity diagram</tspan></text><text xml:space="preserve" x="40" y="106.5" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#334155"><tspan x="40" dy="0">IChatAgent = CopilotFallbackChatAgent when Chat:Agent is copilot. State lasts for the scoped session / Blazor circuit.</tspan></text><text xml:space="preserve" x="825.0" y="261.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="825.0" dy="0">ChatAgentBase.GetReplyAsync</tspan><tspan x="825.0" dy="18">Validate history and cancellation</tspan></text><text xml:space="preserve" x="825.0" y="425.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="825.0" dy="0">Valid request?</tspan></text><text xml:space="preserve" x="280.0" y="421.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="280.0" dy="0">Throw validation / cancellation error</tspan><tspan x="280.0" dy="18">Keep session mode</tspan></text><text xml:space="preserve" x="825.0" y="610.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="825.0" dy="0">offlineMode?</tspan></text><text xml:space="preserve" x="825.0" y="782.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="825.0" dy="0">Create linked cancellation token</tspan><tspan x="825.0" dy="18">CancelAfter(responseTimeout)</tspan><tspan x="825.0" dy="18">await copilotAgent.GetReplyAsync(...).WaitAsync(token)</tspan></text><text xml:space="preserve" x="825.0" y="996.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="825.0" dy="0">Request returned</tspan><tspan x="825.0" dy="18">a valid reply?</tspan></text><text xml:space="preserve" x="1340.0" y="1005.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="1340.0" dy="0">Caller cancelled?</tspan></text><text xml:space="preserve" x="1420.0" y="1201.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="1420.0" dy="0">Throw OperationCanceledException</tspan><tspan x="1420.0" dy="18">Keep session mode</tspan></text><text xml:space="preserve" x="1315.0" y="1406.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="1315.0" dy="0">offlineMode = true</tspan><tspan x="1315.0" dy="18">Log failure type; stay offline for this session</tspan></text><text xml:space="preserve" x="485.0" y="1196.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="485.0" dy="0">Check caller cancellation</tspan><tspan x="485.0" dy="18">Return screened Copilot response</tspan></text><text xml:space="preserve" x="1070.0" y="1616.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="1070.0" dy="0">offlineAgent.GetReplyAsync(history, CT)</tspan><tspan x="1070.0" dy="18">Return fixed service-unavailable support reply</tspan></text><text xml:space="preserve" x="655.0" y="1811.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="655.0" dy="0">Outer ChatAgentBase screens reply</tspan><tspan x="655.0" dy="18">Return AgentChatResponse to ChatService</tspan></text><rect x="578.2" y="407.5" width="43.6" height="21" fill="white"/><text xml:space="preserve" x="600.0" y="422.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="600.0" dy="0">[no]</tspan></text><rect x="824.5" y="509.5" width="51.0" height="21" fill="white"/><text xml:space="preserve" x="850.0" y="524.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="850.0" dy="0">[yes]</tspan></text><rect x="828.2" y="694.5" width="43.6" height="21" fill="white"/><text xml:space="preserve" x="850.0" y="709.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="850.0" dy="0">[no]</tspan></text><rect x="1624.5" y="799.5" width="51.0" height="21" fill="white"/><text xml:space="preserve" x="1650.0" y="814.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1650.0" dy="0">[yes]</tspan></text><rect x="973.1" y="958.5" width="213.8" height="21" fill="white"/><text xml:space="preserve" x="1080.0" y="973.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1080.0" dy="0">[failure / empty / timeout]</tspan></text><rect x="1354.5" y="1096.5" width="51.0" height="21" fill="white"/><text xml:space="preserve" x="1380.0" y="1111.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1380.0" dy="0">[yes]</tspan></text><rect x="1608.2" y="1319.5" width="43.6" height="21" fill="white"/><text xml:space="preserve" x="1630.0" y="1334.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1630.0" dy="0">[no]</tspan></text><rect x="562.5" y="988.5" width="51.0" height="21" fill="white"/><text xml:space="preserve" x="588.0" y="1003.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="588.0" dy="0">[yes]</tspan></text><rect x="305.3" y="1599.5" width="169.4" height="21" fill="white"/><text xml:space="preserve" x="390.0" y="1614.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="390.0" dy="0">[caller still active]</tspan></text><rect x="786.4" y="1327.5" width="147.20000000000002" height="21" fill="white"/><text xml:space="preserve" x="860.0" y="1342.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="860.0" dy="0">[caller cancelled]</tspan></text><text xml:space="preserve" x="255.0" y="780.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#0f172a"><tspan x="255.0" dy="0">Inside GitHubCopilotAgent.GetReplyAsync:</tspan><tspan x="255.0" dy="16">Start a fresh client → create session → send</tspan><tspan x="255.0" dy="16">  transcript → dispose session, then client.</tspan><tspan x="255.0" dy="16">ChatAgentBase checks the returned content. A</tspan><tspan x="255.0" dy="16">  forbidden reply becomes a fixed explanation and</tspan><tspan x="255.0" dy="16">  counts as a valid reply, so Copilot mode</tspan><tspan x="255.0" dy="16">  remains active.</tspan><tspan x="255.0" dy="16">SDK errors become ChatAgentException; missing or</tspan><tspan x="255.0" dy="16">  blank content is rejected.</tspan></text><text xml:space="preserve" x="1410.0" y="770.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#0f172a"><tspan x="1410.0" dy="0">A new scoped session starts with offlineMode = false.</tspan><tspan x="1410.0" dy="16">Caller cancellation propagates without changing mode.</tspan><tspan x="1410.0" dy="16">Timeout applies to startup, send, and cleanup; late provider</tspan><tspan x="1410.0" dy="16">  results are discarded.</tspan></text></svg>