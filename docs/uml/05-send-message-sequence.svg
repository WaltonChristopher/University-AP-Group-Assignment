one" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/><polyline points="158.0,2126.0 145.0,2132.0 158.0,2138.0" fill="none" stroke="#475569" stroke-width="1.5"/><text xml:space="preserve" x="40" y="56.5" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#334155"><tspan x="40" dy="0">5. Send message sequence diagram</tspan></text><text xml:space="preserve" x="40" y="106.5" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#334155"><tspan x="40" dy="0">Successful send to an existing active conversation; each repository operation owns and disposes a fresh EF Core context.</tspan></text><text xml:space="preserve" x="145.0" y="188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="145.0" dy="0">Customer</tspan></text><text xml:space="preserve" x="450.0" y="188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="450.0" dy="0">ChatInput</tspan></text><text xml:space="preserve" x="755.0" y="188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="755.0" dy="0">Chat page</tspan></text><text xml:space="preserve" x="1060.0" y="188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="1060.0" dy="0">ChatService</tspan></text><text xml:space="preserve" x="1365.0" y="188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="1365.0" dy="0">Repository</tspan></text><text xml:space="preserve" x="1670.0" y="188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="1670.0" dy="0">Conversation</tspan></text><text xml:space="preserve" x="1975.0" y="188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="1975.0" dy="0">IChatAgent</tspan></text><text xml:space="preserve" x="2460.0" y="188.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a"><tspan x="2460.0" dy="0">SQLite / EF Core</tspan></text><rect x="201.7" y="236.5" width="191.60000000000002" height="21" fill="white"/><text xml:space="preserve" x="297.5" y="251.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="297.5" dy="0">Click Send / press Enter</tspan></text><rect x="480.8" y="294.5" width="243.4" height="21" fill="white"/><text xml:space="preserve" x="602.5" y="309.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="602.5" dy="0">OnMessageSent.InvokeAsync(text)</tspan></text><rect x="789.5" y="352.5" width="236.0" height="21" fill="white"/><text xml:space="preserve" x="907.5" y="367.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="907.5" dy="0">SendMessageAsync(id, text, CT)</tspan></text><rect x="1096.1" y="411.5" width="287.8" height="21" fill="white"/><text xml:space="preserve" x="1240.0" y="426.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1240.0" dy="0">Validate content; await operationLock</tspan></text><rect x="1064.9" y="500.5" width="295.2" height="21" fill="white"/><text xml:space="preserve" x="1212.5" y="515.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1212.5" dy="0">GetAsync(Guid, currentUser.UserId, CT)</tspan></text><rect x="1761.2" y="550.0" width="302.6" height="38" fill="white"/><text xml:space="preserve" x="1912.5" y="565.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1912.5" dy="0">Create context; load owned conversation</tspan><tspan x="1912.5" dy="16">  + messages</tspan></text><rect x="1794.5" y="616.5" width="236.0" height="21" fill="white"/><text xml:space="preserve" x="1912.5" y="631.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1912.5" dy="0">Read complete; dispose context</tspan></text><rect x="1127.8" y="674.5" width="169.4" height="21" fill="white"/><text xml:space="preserve" x="1212.5" y="689.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1212.5" dy="0">Restored Conversation</tspan></text><rect x="1224.8" y="732.5" width="280.40000000000003" height="21" fill="white"/><text xml:space="preserve" x="1365.0" y="747.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1365.0" dy="0">AddMessage(Customer, content.Trim())</tspan></text><text xml:space="preserve" x="1690.0" y="849.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#0f172a"><tspan x="1690.0" dy="0">Conversation screens customer content</tspan><tspan x="1690.0" dy="16">  and rejects new messages when closed.</tspan></text><rect x="1076.0" y="890.5" width="273.0" height="21" fill="white"/><text xml:space="preserve" x="1212.5" y="905.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1212.5" dy="0">SaveAsync(conversation, userId, CT)</tspan></text><rect x="1787.1" y="940.0" width="250.8" height="38" fill="white"/><text xml:space="preserve" x="1912.5" y="955.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1912.5" dy="0">Create context; append customer;</tspan><tspan x="1912.5" dy="16">  commit; dispose</tspan></text><rect x="1816.7" y="1006.5" width="191.60000000000002" height="21" fill="white"/><text xml:space="preserve" x="1912.5" y="1021.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1912.5" dy="0">Customer message durable</tspan></text><rect x="1157.4" y="1064.5" width="110.2" height="21" fill="white"/><text xml:space="preserve" x="1212.5" y="1079.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1212.5" dy="0">Save complete</tspan></text><rect x="1384.7" y="1122.5" width="265.6" height="21" fill="white"/><text xml:space="preserve" x="1517.5" y="1137.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1517.5" dy="0">GetReplyAsync(ordered history, CT)</tspan></text><text xml:space="preserve" x="2215.0" y="1244.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#0f172a"><tspan x="2215.0" dy="0">ref diagram 6: provider, response screening and fallback.</tspan><tspan x="2215.0" dy="16">No database context remains open during this wait.</tspan></text><rect x="1447.6" y="1285.5" width="139.8" height="21" fill="white"/><text xml:space="preserve" x="1517.5" y="1300.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1517.5" dy="0">AgentChatResponse</tspan></text><rect x="1088.7" y="1336.0" width="302.6" height="38" fill="white"/><text xml:space="preserve" x="1240.0" y="1351.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1240.0" dy="0">Check caller cancellation and non-empty</tspan><tspan x="1240.0" dy="16">  response</tspan></text><rect x="1213.7" y="1433.5" width="302.6" height="21" fill="white"/><text xml:space="preserve" x="1365.0" y="1448.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1365.0" dy="0">AddMessage(Assistant, response.Content)</tspan></text><rect x="1076.0" y="1491.5" width="273.0" height="21" fill="white"/><text xml:space="preserve" x="1212.5" y="1506.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1212.5" dy="0">SaveAsync(conversation, userId, CT)</tspan></text><rect x="1783.4" y="1541.0" width="258.20000000000005" height="38" fill="white"/><text xml:space="preserve" x="1912.5" y="1556.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1912.5" dy="0">Create context; append assistant;</tspan><tspan x="1912.5" dy="16">  commit; dispose</tspan></text><rect x="1820.4" y="1607.5" width="184.20000000000002" height="21" fill="white"/><text xml:space="preserve" x="1912.5" y="1622.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1912.5" dy="0">Assistant reply durable</tspan></text><rect x="1157.4" y="1665.5" width="110.2" height="21" fill="white"/><text xml:space="preserve" x="1212.5" y="1680.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1212.5" dy="0">Save complete</tspan></text><rect x="1114.6" y="1724.5" width="250.8" height="21" fill="white"/><text xml:space="preserve" x="1240.0" y="1739.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1240.0" dy="0">finally: operationLock.Release()</tspan></text><rect x="800.6" y="1813.5" width="213.8" height="21" fill="white"/><text xml:space="preserve" x="907.5" y="1828.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="907.5" dy="0">Saved assistant ChatMessage</tspan></text><rect x="763.6" y="1871.5" width="287.8" height="21" fill="white"/><text xml:space="preserve" x="907.5" y="1886.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="907.5" dy="0">finally: GetConversationAsync(id, CT)</tspan></text><rect x="800.6" y="1929.5" width="213.8" height="21" fill="white"/><text xml:space="preserve" x="907.5" y="1944.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="907.5" dy="0">Fresh conversation snapshot</tspan></text><rect x="808.0" y="1987.5" width="199.0" height="21" fill="white"/><text xml:space="preserve" x="907.5" y="2002.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="907.5" dy="0">GetConversationsAsync(CT)</tspan></text><rect x="785.8" y="2045.5" width="243.4" height="21" fill="white"/><text xml:space="preserve" x="907.5" y="2060.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="907.5" dy="0">Updated owned conversation list</tspan></text><rect x="302.4" y="2095.0" width="295.2" height="38" fill="white"/><text xml:space="preserve" x="450.0" y="2110.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="450.0" dy="0">Render saved messages; clear pending /</tspan><tspan x="450.0" dy="16">  busy / typing state</tspan></text><text xml:space="preserve" x="1370.0" y="2408.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#0f172a"><tspan x="1370.0" dy="0">Failure behavior: once the first SaveAsync succeeds, provider failure, empty response or caller cancellation retains the customer message.</tspan><tspan x="1370.0" dy="16">The UI refreshes saved history even after failure. If another service closes the chat while the agent waits, the second SaveAsync rejects the late reply.</tspan><tspan x="1370.0" dy="16">The service lock covers this instance only; repository transactions enforce persisted closure across instances.</tspan></text></svg>