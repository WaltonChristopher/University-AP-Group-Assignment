idth="1.5" stroke-dasharray="7 5"/><polyline points="1643.8477326781865,620.86127774164 1630.0,624.5 1641.753117651234,632.6770548167573" fill="none" stroke="#475569" stroke-width="1.5"/><text xml:space="preserve" x="40" y="56.5" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#334155"><tspan x="40" dy="0">3. Persistence class diagram</tspan></text><text xml:space="preserve" x="40" y="106.5" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#334155"><tspan x="40" dy="0">Separate domain GUIDs and relational integer keys; navigation associations follow ApplicationDbContext.OnModelCreating.</tspan></text><text xml:space="preserve" x="405.0" y="256.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="405.0" dy="0">Conversation</tspan></text><text xml:space="preserve" x="100" y="291.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="100" dy="0">+ Id: Guid</tspan><tspan x="100" dy="17">+ StartedAt: DateTimeOffset</tspan><tspan x="100" dy="17">+ LastActivityAt: DateTimeOffset</tspan><tspan x="100" dy="17">+ Status: ConversationStatus</tspan><tspan x="100" dy="17">+ Messages: IReadOnlyCollection&lt;ChatMessage&gt;</tspan></text><text xml:space="preserve" x="405.0" y="626.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="405.0" dy="0">ChatMessage</tspan></text><text xml:space="preserve" x="100" y="661.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="100" dy="0">+ Id: Guid</tspan><tspan x="100" dy="17">+ ConversationId: Guid</tspan><tspan x="100" dy="17">+ Role: MessageRole</tspan><tspan x="100" dy="17">+ Content: string</tspan><tspan x="100" dy="17">+ SentAt: DateTimeOffset</tspan></text><rect x="433.4" y="509.5" width="73.2" height="21" fill="white"/><text xml:space="preserve" x="470.0" y="524.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="470.0" dy="0">messages</tspan></text><text xml:space="preserve" x="417.0" y="392.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="417.0" dy="0">1</tspan></text><text xml:space="preserve" x="417.0" y="589.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="417.0" dy="0">0..*</tspan></text><text xml:space="preserve" x="1290.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1290.0" dy="0">«entity»</tspan><tspan x="1290.0" dy="18">User</tspan></text><text xml:space="preserve" x="960" y="301.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="960" dy="0">+ UserId: int {PK}</tspan><tspan x="960" dy="17">+ Support: bool</tspan><tspan x="960" dy="17">+ Conversations: ICollection&lt;Conversation&gt;</tspan><tspan x="960" dy="17">+ Messages: ICollection&lt;Message&gt;</tspan></text><text xml:space="preserve" x="1290.0" y="537.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1290.0" dy="0">«entity»</tspan><tspan x="1290.0" dy="18">Conversation</tspan></text><text xml:space="preserve" x="960" y="586.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="960" dy="0">+ ConversationId: int {PK}</tspan><tspan x="960" dy="17">+ Id: Guid {unique}</tspan><tspan x="960" dy="17">+ UserId: int {FK}</tspan><tspan x="960" dy="17">+ Start: DateTime</tspan><tspan x="960" dy="17">+ DateTime: DateTime</tspan><tspan x="960" dy="17">+ LastUpdated: DateTime</tspan><tspan x="960" dy="17">+ Closed: bool</tspan><tspan x="960" dy="17">+ User: User</tspan><tspan x="960" dy="17">+ Messages: ICollection&lt;Message&gt;</tspan></text><text xml:space="preserve" x="1290.0" y="867.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1290.0" dy="0">«entity»</tspan><tspan x="1290.0" dy="18">Message</tspan></text><text xml:space="preserve" x="960" y="916.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="960" dy="0">+ MessageId: int {PK}</tspan><tspan x="960" dy="17">+ Id: Guid {unique}</tspan><tspan x="960" dy="17">+ MessageContent: string</tspan><tspan x="960" dy="17">+ DateTime: DateTime</tspan><tspan x="960" dy="17">+ Status: string {MessageRole name}</tspan><tspan x="960" dy="17">+ SenderId: int {FK}</tspan><tspan x="960" dy="17">+ ConversationId: int {FK}</tspan><tspan x="960" dy="17">+ Sender: User</tspan><tspan x="960" dy="17">+ Conversation: Conversation</tspan></text><rect x="1285.3" y="459.5" width="169.4" height="21" fill="white"/><text xml:space="preserve" x="1370.0" y="474.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1370.0" dy="0">owner / conversations</tspan></text><text xml:space="preserve" x="1302.0" y="385.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="1302.0" dy="0">1</tspan></text><text xml:space="preserve" x="1302.0" y="504.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="1302.0" dy="0">0..*</tspan></text><rect x="1337.9" y="804.5" width="184.20000000000002" height="21" fill="white"/><text xml:space="preserve" x="1430.0" y="819.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1430.0" dy="0">conversation / messages</tspan></text><text xml:space="preserve" x="1302.0" y="755.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="1302.0" dy="0">1</tspan></text><text xml:space="preserve" x="1302.0" y="834.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="1302.0" dy="0">0..*</tspan></text><rect x="1610.1" y="734.5" width="139.8" height="21" fill="white"/><text xml:space="preserve" x="1680.0" y="749.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1680.0" dy="0">sender / messages</tspan></text><text xml:space="preserve" x="1643" y="286.0" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="1643" dy="0">1</tspan></text><text xml:space="preserve" x="1643" y="943.5" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#334155"><tspan x="1643" dy="0">0..*</tspan></text><text xml:space="preserve" x="430.0" y="1036.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="430.0" dy="0">SqliteConversationRepository</tspan></text><text xml:space="preserve" x="100" y="1071.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="100" dy="0">− ToEntity(message, userId): Data.Entities.Message {static}</tspan><tspan x="100" dy="17">− ToDomain(entity): Domain.Conversation {static}</tspan><tspan x="100" dy="17">− CopyConversation(source, destination): void {static}</tspan></text><rect x="73.4" y="889.5" width="73.2" height="21" fill="white"/><text xml:space="preserve" x="110.0" y="904.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="110.0" dy="0">restores</tspan></text><rect x="689.6" y="924.5" width="250.8" height="21" fill="white"/><text xml:space="preserve" x="815.0" y="939.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="815.0" dy="0">maps GUID, time and closed state</tspan></text><rect x="656.1" y="1167.5" width="287.8" height="21" fill="white"/><text xml:space="preserve" x="800.0" y="1182.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="800.0" dy="0">maps GUID, role, content and UTC time</tspan></text><text xml:space="preserve" x="1290.0" y="1281.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1290.0" dy="0">ApplicationDbContext</tspan></text><text xml:space="preserve" x="960" y="1316.0" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="960" dy="0">+ Users: DbSet&lt;User&gt;</tspan><tspan x="960" dy="17">+ Conversations: DbSet&lt;Data.Entities.Conversation&gt;</tspan><tspan x="960" dy="17">+ Messages: DbSet&lt;Data.Entities.Message&gt;</tspan></text><text xml:space="preserve" x="960" y="1381.5" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" fill="#1e293b"><tspan x="960" dy="0"># OnModelCreating(modelBuilder): void</tspan></text><text xml:space="preserve" x="1305.0" y="1497.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a"><tspan x="1305.0" dy="0">«external»</tspan><tspan x="1305.0" dy="18">DbContext</tspan></text><rect x="1634.9" y="1194.5" width="110.2" height="21" fill="white"/><text xml:space="preserve" x="1690.0" y="1209.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#334155"><tspan x="1690.0" dy="0">model / DbSet</tspan></text><text xml:space="preserve" x="430.0" y="1330.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#0f172a"><tspan x="430.0" dy="0">Mapping: Domain.Conversation.Id ↔ entity Id (GUID). Integer ConversationId / MessageId</tspan><tspan x="430.0" dy="16">  remain database keys.</tspan><tspan x="430.0" dy="16">StartedAt → Start and DateTime; LastActivityAt → LastUpdated; Closed ↔</tspan><tspan x="430.0" dy="16">  ConversationStatus.Closed.</tspan><tspan x="430.0" dy="16">ChatMessage.Role → Message.Status; Content → MessageContent; SentAt → DateTime in UTC.</tspan><tspan x="430.0" dy="16">SenderId references the owner for Customer, Assistant and System roles; it does not</tspan><tspan x="430.0" dy="16">  identify a separate AI user.</tspan><tspan x="430.0" dy="16">Repository operations create / dispose their own context. SaveAsync commits atomically</tspan><tspan x="430.0" dy="16">  and does not reopen a closed chat.</tspan></text><text xml:space="preserve" x="900.0" y="1596.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#0f172a"><tspan x="900.0" dy="0">+ public   − private   # protected   ~ internal   / derived   «…» stereotype</tspan><tspan x="900.0" dy="16">CT = CancellationToken; method default values and most constructors are omitted. Selected members are shown.</tspan><tspan x="900.0" dy="16">Dashed open arrow = dependency (including «tests»); dashed hollow triangle = interface realization; solid hollow triangle = inheritance.</tspan><tspan x="900.0" dy="16">Solid line = association; filled diamond = composition. Multiplicities are shown beside association ends.</tspan></text></svg>